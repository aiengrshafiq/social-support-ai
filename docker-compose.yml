# docker-compose.yml
# version: '3.9'

services:
  # 1. App DB: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Raw Data DB: MongoDB
  mongo:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 3. Vector DB: Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # 4. Graph DB: Neo4j
  neo4j:
    image: neo4j:5
    container_name: neo4j_db
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}

  # 5. Cache: Redis
  redis:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"

  
  # 7. Model Hosting: Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment to enable GPU support (requires NVIDIA container toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

   # --- ADD THE ML SERVICE ---
  ml_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    container_name: eligibility_ml_service
    ports:
      - "8001:8001" # Expose on host port 8001
    volumes:
      # Mount the ml directory if you want live updates during dev,
      # otherwise the Dockerfile COPY is sufficient for production.
       - ./ml:/app/ml # Optional: for live reload during development
    restart: unless-stopped
  # --- END ML SERVICE ---

  # 8. Our FastAPI App (we'll build this next)
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: social_support_api
    env_file: .env
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      - postgres
      - mongo
      - qdrant
      - neo4j
      - redis
      - ollama
      - ml_service
     

  # 9. Our Streamlit UI (we'll build this later)
  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    container_name: social_support_ui
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  mongo_data:
  qdrant_data:
  neo4j_data:
  ollama_data: